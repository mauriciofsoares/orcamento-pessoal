services:
  postgres:
    image: postgres:17-alpine
    container_name: orcamento-pessoal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orcamento
      POSTGRES_PASSWORD: orcamento
      POSTGRES_DB: orcamento_pessoal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamento -d orcamento_pessoal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
